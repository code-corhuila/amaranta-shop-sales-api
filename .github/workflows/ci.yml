name: CI

# Every pull request builds the repository and runs its tests on a clean machine.
# "It works on my computer" is not evidence; a green check here is.

on:
  pull_request:
    branches: [develop, qa, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  base:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: The repository has its minimum content
        run: |
          for file in README.md .github/CODEOWNERS .gitignore .env.example pom.xml deploy/Dockerfile deploy/compose.yml; do
            [ -f "$file" ] || { echo "missing $file"; exit 1; }
          done

      - name: No real environment file or key is versioned
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.pem$|(^|/)keys/'; then
            echo "A real environment file or key is versioned"
            exit 1
          fi

      - name: The core depends on no framework (norm 5.3.3)
        run: |
          if grep -nE '<(groupId|artifactId)>(org\.springframework|spring-|jakarta|javax)' sales-core/pom.xml; then
            echo "sales-core must not declare a framework dependency"
            exit 1
          fi
          if grep -rnE 'import (org\.springframework|jakarta|javax)' sales-core/src; then
            echo "sales-core must not import a framework"
            exit 1
          fi

  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn -B verify

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: The container image builds
        run: docker build -f deploy/Dockerfile -t sales-api:ci .

  # The two checks that need the schema of sales-db and a Docker daemon: the repository against a real PostgreSQL,
  # and the service as a container with Catalog switched off. They run when the repository variable
  # SALES_DB_CHECKOUT is "true", which the team sets once the organization lets this workflow read amaranta-shop-sales-db.
  # Without it they do not run in CI, and scripts/integration-test.sh and scripts/smoke-test.sh run the same on a laptop.
  with-the-database:
    if: ${{ vars.SALES_DB_CHECKOUT == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: sales-api
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/amaranta-shop-sales-db
          ref: develop
          token: ${{ secrets.SALES_DB_READ_TOKEN || github.token }}
          path: amaranta-shop-sales-db
      - name: Repository against PostgreSQL, as sales_app
        run: bash sales-api/scripts/integration-test.sh
      - name: The service as a container, with Catalog down
        run: bash sales-api/scripts/smoke-test.sh
