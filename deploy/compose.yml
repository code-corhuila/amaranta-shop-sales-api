# The sales service only. amaranta-shop-infra-postgres includes this file to compose the platform.
# It connects with its own user, sales_app, never with the administrator (Annex J, J.4).
name: amaranta-shop-sales-api

services:
  sales-api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    environment:
      PORT: "8080"
      DATABASE_URL: jdbc:postgresql://postgres:5432/${PG_DATABASE:?set PG_DATABASE in the environment file}
      DATABASE_USER: sales_app
      DATABASE_PASSWORD: ${SALES_APP_PASSWORD:?set SALES_APP_PASSWORD in the environment file}
      # Public key of amaranta-shop-security, one line with \n escapes.
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?set JWT_PUBLIC_KEY, the public key of amaranta-shop-security}
      CATALOG_API_URL: ${CATALOG_API_URL:-http://catalog-api:8082}
      DB_POOL_MAX: "10"
    # expose, not ports: only the gateway is reachable from the host.
    expose: ["8080"]
    networks: [platform]

networks:
  platform:
    name: platform
    external: true
